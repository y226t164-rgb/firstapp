<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GLITCH DASH - EASY MODE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff00ff;
            --neon-yellow: #ffff00;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #010103;
            overflow: hidden;
            font-family: 'VT323', monospace;
            color: var(--neon-blue);
        }

        #container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 画面フィルター */
        #screen-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 3px 100%;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.5);
        }

        #screen-effect::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: radial-gradient(circle, rgba(18, 16, 16, 0) 60%, rgba(0, 0, 0, 0.6) 100%);
        }

        canvas {
            display: block;
            image-rendering: pixelated;
        }

        #ui {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 50;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            font-size: 28px;
            text-transform: uppercase;
            text-shadow: 2px 2px var(--neon-pink);
        }

        #start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            pointer-events: auto;
            cursor: pointer;
        }

        .glitch-text {
            font-size: clamp(60px, 15vw, 100px);
            font-weight: bold;
            color: white;
            text-shadow: 4px 4px var(--neon-pink), -4px -4px var(--neon-blue);
            animation: text-glitch 1.5s infinite;
        }

        @keyframes text-glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        .blink { animation: blink 1s steps(2, start) infinite; }
        @keyframes blink { to { visibility: hidden; } }

        .hidden { display: none !important; }

        .glitch-mode {
            animation: screen-shake 0.15s infinite;
        }
        @keyframes screen-shake {
            0% { transform: translate(2px, -2px); filter: hue-rotate(0deg); }
            50% { transform: translate(-2px, 2px); filter: hue-rotate(20deg); }
            100% { transform: translate(1px, 1px); filter: hue-rotate(0deg); }
        }
    </style>
</head>
<body>

<div id="container">
    <div id="screen-effect"></div>
    
    <div id="ui">
        <div class="hud-top">
            <div>
                <div id="score">SCORE: 000000</div>
                <div id="combo" style="color: var(--neon-blue)">COMBO: x0</div>
            </div>
            <div>
                <div id="high-score">HIGH SCORE: 045000</div>
            </div>
        </div>
        <div id="glitch-banner" class="glitch-text hidden" style="align-self:center;">GLITCH</div>
    </div>

    <div id="start-overlay" onclick="startGame()">
        <h1 class="glitch-text">GLITCH DASH</h1>
        <p style="font-size: 24px; color: var(--neon-blue);">RELAXED MODE ACTIVE</p>
        <p class="blink" style="margin-top: 50px; font-size: 32px;">[ TAP TO START ]</p>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('container');
    const scoreEl = document.getElementById('score');
    const comboEl = document.getElementById('combo');
    const glitchBanner = document.getElementById('glitch-banner');
    
    let width, height;
    let score = 0;
    let combo = 0;
    let gameActive = false;
    let glitchTime = 0;
    
    let enemies = [];
    let particles = [];
    let slashLine = null;
    let codeSnippets = [];

    const PLAYER_COLOR = '#00f2ff';
    const ENEMY_COLOR = '#ff00ff';

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        initBackground();
    }
    window.addEventListener('resize', resize);
    resize();

    let player = { x: width/2, y: height/2, angle: 0 };

    function initBackground() {
        const codeText = ["count = 0", "glitch = true", "SYSTEM_OK", "0x00FF21", "EASY_MODE"];
        codeSnippets = [];
        for(let i=0; i<10; i++) {
            codeSnippets.push({
                x: Math.random() * width,
                y: Math.random() * height,
                text: codeText[Math.floor(Math.random() * codeText.length)],
                opacity: Math.random() * 0.2
            });
        }
    }

    class Enemy {
        constructor() {
            this.dead = false;
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.max(width, height) * 0.8;
            this.x = width/2 + Math.cos(angle) * radius;
            this.y = height/2 + Math.sin(angle) * radius;
            // スピードを大幅にダウン（初心者向け）
            this.speed = Math.random() * 1.5 + 1; 
            this.size = 18;
            this.color = ENEMY_COLOR;
            this.angle = Math.atan2(player.y - this.y, player.x - this.x);
        }
        update() {
            // 常にプレイヤーをゆっくり追う
            this.angle = Math.atan2(player.y - this.y, player.x - this.x);
            this.x += Math.cos(this.angle) * this.speed;
            this.y += Math.sin(this.angle) * this.speed;
            
            const d = Math.hypot(this.x - player.x, this.y - player.y);
            if(d < 25 && glitchTime <= 0) { // グリッチ中は無敵
                gameOver();
            }
        }
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(Date.now() / 300);
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 3;
            ctx.shadowBlur = 8;
            ctx.shadowColor = this.color;
            ctx.beginPath();
            ctx.moveTo(-this.size, -this.size); ctx.lineTo(this.size, this.size);
            ctx.moveTo(this.size, -this.size); ctx.lineTo(-this.size, this.size);
            ctx.stroke();
            ctx.restore();
        }
        die() {
            this.dead = true;
            for(let i=0; i<12; i++) particles.push(new Particle(this.x, this.y, this.color));
            score += 100 + (combo * 10);
            combo++;
            // 5コンボごとにグリッチ（無敵＆ボーナス）
            if(combo % 5 === 0) triggerGlitch();
            scoreEl.innerText = `SCORE: ${score.toString().padStart(6, '0')}`;
            comboEl.innerText = `COMBO: x${combo}`;
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y;
            const a = Math.random() * Math.PI * 2;
            const s = Math.random() * 5 + 1;
            this.vx = Math.cos(a) * s;
            this.vy = Math.sin(a) * s;
            this.life = 1.0;
            this.color = color;
        }
        update() {
            this.x += this.vx; this.y += this.vy;
            this.life -= 0.04;
        }
        draw() {
            ctx.fillStyle = this.color;
            ctx.globalAlpha = this.life;
            ctx.fillRect(this.x, this.y, 3, 3);
            ctx.globalAlpha = 1;
        }
    }

    function triggerGlitch() {
        glitchTime = 120; // 約2秒
        glitchBanner.classList.remove('hidden');
        container.classList.add('glitch-mode');
        setTimeout(() => {
            glitchBanner.classList.add('hidden');
            container.classList.remove('glitch-mode');
        }, 1500);
    }

    function startGame() {
        document.getElementById('start-overlay').classList.add('hidden');
        score = 0; combo = 0; gameActive = true;
        enemies = []; particles = [];
        scoreEl.innerText = "SCORE: 000000";
        comboEl.innerText = "COMBO: x0";
        loop();
    }

    function gameOver() {
        gameActive = false;
        document.getElementById('start-overlay').classList.remove('hidden');
        document.querySelector('#start-overlay h1').innerText = "DATA ERROR";
    }

    // 画面タップで移動＆攻撃
    container.addEventListener('pointerdown', (e) => {
        if(!gameActive) return;
        const tx = e.clientX;
        const ty = e.clientY;
        
        const p1 = { x: player.x, y: player.y };
        const p2 = { x: tx, y: ty };
        
        slashLine = { p1, p2, life: 12 };
        
        // 当たり判定を広く（50px -> 80px）
        enemies.forEach(en => {
            if(distToSegment(en, p1, p2) < 80) en.die();
        });

        player.angle = Math.atan2(ty - player.y, tx - player.x);
        player.x = tx;
        player.y = ty;
    });

    function distToSegment(p, v, w) {
        const l2 = (v.x - w.x)**2 + (v.y - w.y)**2;
        if (l2 == 0) return Math.hypot(p.x - v.x, p.y - v.y);
        let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
        t = Math.max(0, Math.min(1, t));
        return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
    }

    function loop() {
        if(!gameActive) return;
        
        ctx.fillStyle = 'rgba(1, 1, 3, 0.4)';
        ctx.fillRect(0, 0, width, height);

        // 背景コード
        ctx.font = '20px VT323';
        codeSnippets.forEach(c => {
            ctx.fillStyle = `rgba(0, 242, 255, ${c.opacity})`;
            ctx.fillText(c.text, c.x, c.y);
        });

        // 斬撃
        if(slashLine) {
            ctx.strokeStyle = 'white';
            ctx.lineWidth = slashLine.life;
            ctx.shadowBlur = 15;
            ctx.shadowColor = PLAYER_COLOR;
            ctx.beginPath();
            ctx.moveTo(slashLine.p1.x, slashLine.p1.y);
            ctx.lineTo(slashLine.p2.x, slashLine.p2.y);
            ctx.stroke();
            slashLine.life -= 1;
            if(slashLine.life <= 0) slashLine = null;
        }

        // 敵の出現ペースを調整
        if(Math.random() < 0.03) enemies.push(new Enemy());

        enemies = enemies.filter(e => !e.dead);
        enemies.forEach(e => { e.update(); e.draw(); });

        particles = particles.filter(p => p.life > 0);
        particles.forEach(p => { p.update(); p.draw(); });

        // プレイヤー描画
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(player.angle);
        ctx.shadowBlur = 15;
        ctx.shadowColor = PLAYER_COLOR;
        ctx.strokeStyle = PLAYER_COLOR;
        ctx.lineWidth = 4;
        for(let i=0; i<3; i++) {
            ctx.save();
            ctx.translate(-i * 12, 0);
            ctx.globalAlpha = 1 - (i * 0.3);
            ctx.beginPath();
            ctx.moveTo(-12, -12); ctx.lineTo(12, 0); ctx.lineTo(-12, 12);
            ctx.stroke();
            ctx.restore();
        }
        ctx.restore();

        if(glitchTime > 0) glitchTime--;

        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
